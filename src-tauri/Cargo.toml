[package]
name = "corelume"
version = "1.0.0"
edition = "2024"
description = "A light, good-looking system monitor dashboard"
license = "MIT"

[dependencies]
nvml-wrapper = "0.13.0"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
sysinfo = { version = "0.40.3", default-features = false, features = ["system", "disk"] }
tauri = { version = "2.12.5", features = ["tray-icon", "custom-protocol"] }
tauri-plugin-single-instance = "2.5.5"
tauri-plugin-window-state = "2.5.0"
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_System_LibraryLoader", "Win32_System_SystemInformation", "Win32_System_Threading", "Win32_System_Performance", "Win32_NetworkManagement_IpHelper", "Win32_NetworkManagement_Ndis", "Win32_Security", "Win32_System_ProcessStatus", "Win32_Networking_WinSock", "Win32_UI_WindowsAndMessaging", "Win32_UI_Shell", "Win32_System_Com", "Win32_Security_Authentication_Identity"] }

[build-dependencies]
tauri-build = { version = "2.7.4", features = [] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
